[project]
name = "wsx"
version = "0.1.0"
description = "Web-search experiment harness: run, save and compare search-API retrieval on pharma CI questions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
wsx = "wsx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
